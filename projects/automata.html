<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cellular automata · playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="../index.html" class="brand">playground</a>
    <nav>
      <a href="../index.html">home</a>
      <a href="../projects.html">projects</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="controls">
      <div class="field">
        <label for="rule">rule</label>
        <input type="number" id="rule" min="0" max="255" value="30" step="1">
      </div>
      <button class="go" id="go">render</button>
      <div class="field">
        <label>rule as neighbourhood map</label>
        <div class="rulebits" id="rulebits"></div>
      </div>
    </div>

    <canvas id="ca" aria-label="cellular automaton visualization"></canvas>
    <p class="readout" id="readout"></p>

    <div class="presets">
      <span>try:</span>
      <a href="#" data-rule="30">30 chaos</a>
      <a href="#" data-rule="90">90 sierpiński</a>
      <a href="#" data-rule="110">110 turing-complete</a>
      <a href="#" data-rule="184">184 traffic</a>
      <a href="#" data-rule="150">150 xor</a>
      <a href="#" data-rule="54">54</a>
    </div>
  </section>
</main>

<footer class="wrap">built for fun · hosted on github pages</footer>

<script src="../js/automata.js"></script>
</body>
</html>
